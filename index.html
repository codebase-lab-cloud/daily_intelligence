    state.dark = !!parsed.dark;
  }
} catch (e) {}

function saveState() {
  try {
    localStorage.setItem("di_app_state_v1", JSON.stringify({
      savedIds: state.savedIds,
      notes: state.notes,
      dark: state.dark
    }));
  } catch (e) {}
  updateSavedBadges();
}

function applyTheme() {
  document.documentElement.classList.toggle("dark", state.dark);
}
applyTheme();

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.add("hidden"), 2200);
}

function updateSavedBadges() {
  const n = state.savedIds.length;
  const d = document.getElementById("saved-count-desktop");
  const m = document.getElementById("saved-count-mobile");
  if (d) d.textContent = n;
  if (m) {
    m.textContent = n;
    m.classList.toggle("hidden", n === 0);
  }
}

function getArticleById(id) {
  if (ARTICLES[id]) return ARTICLES[id];
  const edu = EDU_TOPICS.find(x => x.id === id);
  if (edu) {
    return {
      id: edu.id, category: "Things You Should Know", badge: "Beginner Guide • Evergreen",
      title: edu.title, summary: edu.oneLiner, simpleExplain: edu.detail,
      stats: [{ label: "Difficulty", value: "Beginner Friendly" }, { label: "Best For", value: "Everyday Savers" }],
      whyMatters: edu.oneLiner, realWorldExample: edu.example,
      opportunities: "Building clear fundamentals prevents costly mistakes and helps you spot misleading sales pitches.",
      risks: edu.risk,
      sources: [{ name: edu.source.name, url: edu.source.url, date: "Verified Reference" }],
      related: ["concept-sip", "concept-emergency", "concept-div"].filter(x => x !== id)
    };
  }
  for (const cityName of Object.keys(REAL_ESTATE)) {
    const loc = REAL_ESTATE[cityName].find(x => x.id === id);
    if (loc) {
      return {
        id: loc.id, category: `Real Estate • ${cityName}`, badge: loc.dataType,
        title: `${loc.name}, ${cityName}: ₹${loc.avg.toLocaleString("en-IN")}/sq ft (${loc.trend})`,
        summary: `Apartment rates range ${loc.range}/sq ft with ${loc.yoy} growth. ${loc.infra}`,
        simpleExplain: `In ${loc.name} (${cityName}), a typical 1,000 sq ft flat costs roughly ₹${Math.round(loc.avg * 1000 / 100000)} Lakh (before stamp duty & GST). ${loc.connectivity} is a major driver here.`,
        stats: [
          { label: "Avg Price / sq ft", value: `₹${loc.avg.toLocaleString("en-IN")}` },
          { label: "Typical Range", value: loc.range },
          { label: "Price Trend", value: loc.yoy },
          { label: "Segment & Supply", value: `${loc.tier} • ${loc.supply}` }
        ],
        whyMatters: `Data Clarity: This figure is a ${loc.dataType}. Always check the builder's per-sq-ft price on Carpet Area and verify MahaRERA/KarnRERA status. Monthly/quarterly historical splits are not uniformly published across portals, so 1Y/3Y verified trends are shown.`,
        realWorldExample: `On a 1,000 sq ft flat at ₹${loc.avg.toLocaleString("en-IN")}/sq ft (₹${Math.round(loc.avg/100)}L base), a 20% down payment is ~₹${Math.round(loc.avg * 2 / 100)}L, plus ~12% for stamp duty, registration & GST.`,
        opportunities: loc.pros, risks: loc.risks,
        sources: [{ name: loc.source.name, url: loc.source.url, date: "Nov 2026" }],
        related: REAL_ESTATE[cityName].filter(x => x.id !== id).slice(0, 2).map(x => x.id)
      };
    }
  }
  if (id === "exp-rupee") return EXTRA_ARTICLES["exp-rupee"];
  if (id === "exp-gold-etf") return ARTICLES["etf-comparison"];
  if (id === "exp-gcc") return ARTICLES["it-jobs-india"];
  if (id === "exp-rates-re") return getArticleById("concept-rbi");
  if (id === "exp-ai-devs") return ARTICLES["it-jobs-usa"];
  if (id === "exp-mf-money") return getArticleById("concept-compounding");
  return null;
}

function updateSipCalc() {
  const amt = parseFloat(document.getElementById("sip-amt")?.value || 0);
  const yrs = parseFloat(document.getElementById("sip-yrs")?.value || 0);
  const rate = parseFloat(document.getElementById("sip-rate")?.value || 0);
  const out = document.getElementById("sip-output");
  if (!out) return;
  if (amt <= 0 || yrs <= 0 || rate <= 0) { out.innerHTML = "Enter positive values above."; return; }
  const n = yrs * 12;
  const r = rate / 12 / 100;
  const fv = amt * ((Math.pow(1 + r, n) - 1) / r) * (1 + r);
  const invested = amt * n;
  const gain = fv - invested;
  out.innerHTML = `
    <div>You Invest: <strong>₹${Math.round(invested).toLocaleString("en-IN")}</strong></div>
    <div>Est. Wealth Gained: <strong class="text-emerald-600">₹${Math.round(gain).toLocaleString("en-IN")}</strong></div>
    <div class="text-sm pt-1">Estimated Total Value: <strong class="text-emerald-700 dark:text-emerald-300">₹${Math.round(fv).toLocaleString("en-IN")}</strong></div>
  `;
}

function updateEmiCalc() {
  const loanL = parseFloat(document.getElementById("emi-loan")?.value || 0);
  const rate = parseFloat(document.getElementById("emi-rate")?.value || 0);
  const yrs = parseFloat(document.getElementById("emi-yrs")?.value || 0);
  const out = document.getElementById("emi-output");
  if (!out) return;
  if (loanL <= 0 || rate <= 0 || yrs <= 0) { out.innerHTML = "Enter positive values above."; return; }
  const P = loanL * 100000;
  const r = rate / 12 / 100;
  const n = yrs * 12;
  const emi = (P * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
  const total = emi * n;
  const interest = total - P;
  out.innerHTML = `
    <div class="text-sm">Monthly EMI: <strong class="text-indigo-700 dark:text-indigo-300">₹${Math.round(emi).toLocaleString("en-IN")} / mo</strong></div>
    <div>Total Interest: <strong>₹${(interest / 100000).toFixed(2)} Lakh</strong></div>
    <div>Total Payable: <strong>₹${(total / 100000).toFixed(2)} Lakh</strong></div>
  `;
}

async function refreshLiveData() {
  const btn = document.getElementById("refresh-data-btn");
  const icon = document.getElementById("refresh-icon");
  if (btn) btn.disabled = true;
  if (icon) icon.classList.add("animate-spin");

  let fxRate = null;
  let dataJsonApplied = false;
  let liveNewsUpdated = false;

  try {
    // 1. Fetch live USD/INR directly in browser (on-demand only)
    const fxUrls = [
      { url: "https://open.er-api.com/v6/latest/USD", pick: d => d?.rates?.INR },
      { url: "https://api.frankfurter.app/latest?from=USD&to=INR", pick: d => d?.rates?.INR }
    ];
    for (const src of fxUrls) {
      try {
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 4000);
        const res = await fetch(src.url, { cache: "no-store", signal: ctrl.signal });
        clearTimeout(tid);
        if (res.ok) {
          const json = await res.json();
          const val = src.pick(json);
          if (typeof val === "number" && Number.isFinite(val)) {
            fxRate = val.toFixed(2);
            break;
          }
        }
      } catch (err) {}
    }

    // 2. Fetch live PAXG (Gold backing) from Binance
    try {
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), 4000);
      const bRes = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT", { signal: ctrl.signal });
      clearTimeout(tid);
      if (bRes.ok) {
        const bJson = await bRes.json();
        const paxg = parseFloat(bJson.price);
        const inr = parseFloat(fxRate || liveData.usdInr || "88.42");
        if (paxg > 0 && inr > 0) {
          const g10_24k = Math.round((paxg / 31.1035) * 10 * inr);
          const g10_22k = Math.round(g10_24k * (22 / 24));
          liveData.gold24k = `₹${g10_24k.toLocaleString("en-IN")}`;
          liveData.gold22k = `₹${g10_22k.toLocaleString("en-IN")}`;
        }
      }
    } catch (err) {}

    // 3. Fetch data.json in GitHub Pages repo (Sensex, Nifty, Brent, Market Summary, Breaking News)
    try {
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), 4000);
      const djRes = await fetch(`./data.json?t=${Date.now()}`, { cache: "no-store", signal: ctrl.signal });
      clearTimeout(tid);
      if (djRes.ok) {
        const dj = await djRes.json();
        if (dj && typeof dj === "object") {
          for (const key of ["usdInr", "brent", "sensex", "sensexDelta", "nifty", "niftyDelta", "gold24k", "gold22k", "silverKg", "marketSummary", "dateDisplay"]) {
            if (dj[key]) liveData[key] = String(dj[key]);
          }
          if (Array.isArray(dj.breakingNews) && dj.breakingNews.length > 0) {
            dj.breakingNews.forEach(item => {
              ARTICLES[item.id] = item;
              if (!liveFeedItems.some(x => x.id === item.id)) {
                liveFeedItems.unshift(item);
              }
            });
            liveNewsUpdated = true;
          }
          dataJsonApplied = true;
        }
      }
    } catch (err) {}

    // 4. Fetch Live Tech & AI News directly from Hacker News API (CORS: *)
    try {
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), 4500);
      const hnRes = await fetch("https://hacker-news.firebaseio.com/v0/topstories.json", { signal: ctrl.signal });
      clearTimeout(tid);
      if (hnRes.ok) {
        const hnIds = (await hnRes.json()).slice(0, 5);
        const storyPromises = hnIds.map(async id => {
          try {
            const r = await fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`);
            return await r.json();
          } catch(e) { return null; }
        });
        const stories = (await Promise.all(storyPromises)).filter(s => s && s.title);
        if (stories.length > 0) {
          stories.forEach((s, idx) => {
            const artId = `live-hn-${s.id}`;
            const hnItem = {
              id: artId,
              category: "AI & Technology Wire",
              badge: "Hacker News Live",
              badgeClass: "text-amber-600 dark:text-amber-400",
              title: s.title,
              summary: `Trending global engineering & tech discussion: ${s.score || 0} upvotes on Hacker News by @${s.by || "engineer"}.`,
              simpleExplain: `This is a live top-ranked discussion in the global technology community right now, highlighting software, AI developments, and architecture shifts.`,
              stats: [
                { label: "Community Upvotes", value: `${s.score || 0} pts` },
                { label: "Discussion Comments", value: `${s.descendants || 0}` },
                { label: "Network", value: "Hacker News" },
                { label: "State", value: "Live Trending" }
              ],
              whyMatters: "Developer conversations and engineering releases on Hacker News frequently foreshadow changes in enterprise tech, cloud infrastructure, and AI tools.",
              realWorldExample: "Technologies discussed here frequently become standard corporate engineering toolkits and enterprise investments within 12-18 months.",
              opportunities: "Early insight into developer productivity tools, open-source models, and distributed systems innovations.",
              risks: "Fast-moving early releases; implementations should be tested and evaluated before mission-critical usage.",
              sources: [
                { name: "Hacker News Original Discussion", url: s.url || `https://news.ycombinator.com/item?id=${s.id}`, date: "Live Today" }
              ],
              sourceName: "Hacker News",
              timeAgo: "Trending"
            };
            ARTICLES[artId] = hnItem;
            const exIdx = liveFeedItems.findIndex(x => x.id === artId);
            if (exIdx >= 0) liveFeedItems[exIdx] = hnItem;
            else liveFeedItems.splice(idx, 0, hnItem);
          });
          liveNewsUpdated = true;
        }
      }
    } catch (err) {}

    // 5. Fetch Live Featured World News from Wikipedia REST API (CORS: *)
    try {
      const d = new Date();
      const wikiUrl = `https://en.wikipedia.org/api/rest_v1/feed/featured/${d.getFullYear()}/${String(d.getMonth()+1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), 4500);
      const wRes = await fetch(wikiUrl, { signal: ctrl.signal });
      clearTimeout(tid);
      if (wRes.ok) {
        const wJson = await wRes.json();
        const wNews = wJson.news;
        if (Array.isArray(wNews) && wNews.length > 0) {
          wNews.slice(0, 3).forEach((nw, idx) => {
            const rawStory = nw.story || "";
            const cleanText = rawStory.replace(/<[^>]+>/g, "").trim();
            const firstLink = nw.links?.[0];
            const linkTitle = firstLink?.titles?.plain || "World Event";
            const linkUrl = firstLink?.content_urls?.desktop?.page || "https://en.wikipedia.org/wiki/Portal:Current_events";
            const artId = `live-wiki-${idx}`;
            const wItem = {
              id: artId,
              category: "Global Events Wire",
              badge: "Wikipedia Current Events",
              badgeClass: "text-blue-600 dark:text-blue-400",
              title: `${linkTitle}: ${cleanText.slice(0, 110)}${cleanText.length > 110 ? "..." : ""}`,
              summary: cleanText,
              simpleExplain: `Verified international development currently recorded on Wikipedia's current events portal and global news services.`,
              stats: [
                { label: "News Channel", value: "Global Wire" },
                { label: "Topic", value: linkTitle },
                { label: "Platform", value: "Wikipedia" },
                { label: "Verification", value: "Crowdsourced" }
              ],
              whyMatters: "Major geopolitical, policy, and global economic developments directly shape supply chains, oil prices, and cross-border financial flows.",
              realWorldExample: "Overseas policies and macroeconomic shifts affect international investor sentiment and currency exchange rates.",
              opportunities: "Maintaining wide-angle global awareness ensures smarter personal finance, business, and investment decisions.",
              risks: "Macro turbulence and shifting currency valuations during international political and economic events.",
              sources: [
                { name: `Wikipedia: ${linkTitle}`, url: linkUrl, date: "Live Today" }
              ],
              sourceName: "Wikipedia News",
              timeAgo: "Today"
            };
            ARTICLES[artId] = wItem;
            const exIdx = liveFeedItems.findIndex(x => x.id === artId);
            if (exIdx >= 0) liveFeedItems[exIdx] = wItem;
            else liveFeedItems.push(wItem);
          });
          liveNewsUpdated = true;
        }
      }
    } catch (err) {}

    // Apply live FX
    if (fxRate) {
      liveData.usdInr = fxRate;
      if (ARTICLES["global-markets-today"]?.stats?.[0]) {
        ARTICLES["global-markets-today"].stats[0].value = `₹${fxRate}`;
      }
    }

    // Re-stamp all core articles across all sections to reflect refreshed state
    const timeStr = new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    const dateStr = new Date().toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
    
    liveData.isRefreshed = true;
    liveData.refreshedAt = timeStr;
    liveData.refreshedDate = dateStr;
    liveData.liveSource = `Refreshed ${timeStr} (Whole App & Live Feeds)`;

    ["indian-market-today", "global-markets-today", "ai-anthropic-ipo", "gold-silver-today", "it-jobs-india"].forEach(aid => {
      if (ARTICLES[aid]) {
        ARTICLES[aid].badge = `🔴 Refreshed at ${timeStr}`;
      }
    });

    render();
    showToast(`✨ Whole app & news successfully refreshed (${timeStr})`);
  } catch (err) {
    console.error("Refresh error:", err);
    render();
    showToast("App refreshed with verified live snapshot.");
  } finally {
    if (icon) icon.classList.remove("animate-spin");
    if (btn) btn.disabled = false;
  }
}

document.getElementById("refresh-data-btn").addEventListener("click", refreshLiveData);

// Initial render
render();
</script>
</body>
</html>
